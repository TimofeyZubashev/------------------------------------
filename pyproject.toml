[project]
name = "text-summarizer-transformer"
version = "0.1.0"
description = "Transformer-based text summarizer architecture"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
viz = [
    "matplotlib>=3.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
